services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders_db
    ports:
      - "3306:3306"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  authservice:
    build: ./authservice
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db
      SPRING_RABBITMQ_HOST: rabbitmq

  bff:
    build: ./bff
    ports:
      - "3000:3000"
    depends_on:
      - authservice
      - orderservice
      - eventservice

  order-service:
    build: ./orderservice
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/orders_db
      SPRING_RABBITMQ_HOST: rabbitmq

  inventory-service:
    build: ./inventoryservice
    ports:
      - "8082:8082"
    depends_on:
      - mysql
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/inventory_db
      SPRING_RABBITMQ_HOST: rabbitmq

  # --- stub, build in Phase 2 ---
  event-service:
    build: ./eventservice
    ports:
      - "8083:8083"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/events_db

  # --- stub, build in Phase 3 ---
  notification-service:
    build: ./notificationservice
    ports:
      - "8084:8084"
    depends_on:
      - rabbitmq
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq

  bot-service:
    build: ./botservice
    ports:
      - "8085:8085"
    depends_on:
      - rabbitmq
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq