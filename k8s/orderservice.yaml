apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderservice
  namespace: ticketservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderservice
  template:
    metadata:
      labels:
        app: orderservice
    spec:
      containers:
        - name: orderservice
          image: supersmallservices-orderservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/orders_db?createDatabaseIfNotExist=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticketservice-secrets
                  key: mysql-root-password
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: ticketservice-config
                  key: SPRING_RABBITMQ_HOST
            - name: GRPC_INVENTORY_HOST
              valueFrom:
                configMapKeyRef:
                  name: ticketservice-config
                  key: GRPC_INVENTORY_HOST
            - name: GRPC_INVENTORY_PORT
              valueFrom:
                configMapKeyRef:
                  name: ticketservice-config
                  key: GRPC_INVENTORY_PORT
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orderservice
  namespace: ticketservice
spec:
  selector:
    app: orderservice
  ports:
    - port: 8081
      targetPort: 8081
