apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventoryservice
  namespace: ticketservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventoryservice
  template:
    metadata:
      labels:
        app: inventoryservice
    spec:
      containers:
        - name: inventoryservice
          image: supersmallservices-inventoryservice:latest
          imagePullPolicy: Never
          ports:
            - name: rest
              containerPort: 8082
            - name: grpc
              containerPort: 9090
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/inventory_db?createDatabaseIfNotExist=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticketservice-secrets
                  key: mysql-root-password
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: ticketservice-config
                  key: SPRING_RABBITMQ_HOST
            - name: GRPC_SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: ticketservice-config
                  key: GRPC_SERVER_PORT
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventoryservice
  namespace: ticketservice
spec:
  selector:
    app: inventoryservice
  ports:
    - name: rest
      port: 8082
      targetPort: 8082
    - name: grpc
      port: 9090
      targetPort: 9090
