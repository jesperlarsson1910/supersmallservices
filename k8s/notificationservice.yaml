apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificationservice
  namespace: ticketservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notificationservice
  template:
    metadata:
      labels:
        app: notificationservice
    spec:
      containers:
        - name: notificationservice
          image: supersmallservices-notificationservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: ticketservice-config
                  key: SPRING_RABBITMQ_HOST
            - name: SPRING_MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: ticketservice-config
                  key: SPRING_MAIL_HOST
            - name: SPRING_MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: ticketservice-config
                  key: SPRING_MAIL_PORT
          readinessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notificationservice
  namespace: ticketservice
spec:
  selector:
    app: notificationservice
  ports:
    - port: 8084
      targetPort: 8084
