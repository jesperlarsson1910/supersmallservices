spring.application.name=bff
server.port=3000

# JWT
jwt.secret=ticketservice-dev-secret-must-be-at-least-32-chars-long

# Downstream service URLs
services.event-url=http://eventservice:8083
services.inventory-url=http://inventoryservice:8082
services.order-url=http://orderservice:8081

# Serve static files (index.html) from classpath:/static/
spring.web.resources.static-locations=classpath:/static/

logging.level.org.example.bff=DEBUG

