syntax = "proto3";

option java_package = "org.example.grpc";
option java_outer_classname = "UserProto";
option java_multiple_files = true;

service UserGrpcService {
  rpc GetUserById(UserRequest) returns (UserResponse);
}

message UserRequest {
  int64 user_id = 1;
}

message UserResponse {
  int64 id       = 1;
  string username = 2;
  string email   = 3;
  string name    = 4;
  bool found     = 5;
}
